ch08-fig3:
  sha1: 9e0f8467189e6f6da35f1a74a1407152cf937e7a
  alt: 'One materialization per layer, from left to right: Sources (raw tables loaded by others, not built by dbt)
    → Staging (rename, cast, light cleaning: view) → Intermediate (reusable steps, joins, re-graining: ephemeral
    or view) → Marts (business entities read by people: table, later incremental) → Consumers (BI dashboards, notebooks,
    apps).'
ch09-fig1:
  sha1: aa8110b1153a3cea7d36a0519f4c906168ebacde
  alt: 'The layers of the practice project, from left to right: sources, staging (views), intermediate and marts
