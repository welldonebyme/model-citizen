    STALE.
ch22-fig1:
  sha1: d20ccbd07318f192510ddae11bfd35417cfd8b8b
  alt: 'The four phases of a dbt command, the cheapest command that reaches each phase, and its typical errors.
    1. Parse (read YAML and files; dbt parse): Parsing Error (YAML), Compilation Error (Jinja syntax, missing ref/source,
    duplicate names). 2. Compile (render Jinja, link the DAG; dbt compile, dbt ls): Compilation Error (unknown macro,
    missing var), Found a cycle (a “Dependency Error”). 3. Execute (send SQL to the warehouse; dbt run, dbt show):
    Runtime Error / Binder Error (DuckDB), Database Error (other warehouses), connection errors. 4. Check (data
    tests and unit tests; dbt test, dbt build): FAIL / WARN (the data breaks a rule).'
ch22-fig2:
  sha1: b60cbd8dda6f6da9c40447a92fc87166e0a397c0
  alt: 'A decision tree to find the cause of an error. Did dbt stop before sending SQL (Parsing / Compilation Error,
    cycle)? Yes: a dbt problem in the files: fix YAML, Jinja, ref/source names; check with dbt parse and dbt ls.
    No: copy target/compiled/… into the warehouse console and run it. Does it fail too? Yes: a pure SQL problem:
    fix the SQL in the model (column, join, syntax); use dbt show to check. No, it works: a dbt problem around the
    SQL: read target/run and logs/dbt.log (materialization, ;, contract, hooks, permissions on the target schema,
    incremental filter, on_schema_change…).'
ch22-fig3:
  sha1: 4d5e879e719c23cc29a52ac6057abd88dac1a05a
  alt: 'The fix workflow in ten steps: 1 Reproduce in dev, 2 Branch (git switch -c), 3 Fix the root cause, 4 Test
    (dbt build -s m+), 5 Preview (state:modified+), 6 Commit, push, PR, 7 CI runs (slim CI), 8 Review and approve,
    9 Merge into main, 10 Production job runs. Steps 4 and 7 are highlighted.'
ch23-fig1:
  sha1: fce43db9ed79f13673623ad926cb671840dedd04
  alt: 'The simplified practice DAG with six numbered failure points (red circles): 1 at source: orders (source
    missing or stale), 2 at int_…_pivoted (model SQL error), 3 at stg_…_orders (test failure), 4 at dim_customers
    (hook failure), 5 at fct_order_items (the warehouse) and 6 at source: orders again (upstream data change).'
  description: Sources orders, payments and order_items feed stg_…_orders, stg_stripe__payments and stg_…_order_items.
    stg_…_orders and stg_stripe__payments feed int_orders__enriched; stg_stripe__payments also feeds int_…_pivoted.
    int_orders__enriched feeds fct_orders and fct_monthly_revenue; int_…_pivoted feeds fct_orders; stg_…_orders
    and stg_…_order_items feed fct_order_items; fct_orders feeds dim_customers. The meaning of the numbers is given
    in the table after the figure.
ch23-fig2:
  sha1: e7c8762d1a6d2c884c88a42cc967bb1892ab685a
  alt: 'Two kinds of clone. On Snowflake, Databricks and BigQuery, a zero-copy clone: marts.fct_orders and dbt_adnane.fct_orders
    point to the same shared storage blocks (no copy); the clone is a real table. On DuckDB, Postgres and others,
    a pointer view: dbt_adnane.fct_orders is a view (select * from marts.fct_orders, the table), so every query
    reads production.'
ch24-fig1:
  sha1: 8feafc509303252d5695295daac12a16b90fb351
  alt: 'How state comparison works. The state (the past: prod-artifacts/manifest.json, the last production build)
    and the current project (your files, parsed now, on your branch) go into a comparison, node by node, by unique
    ID. The comparison selects state:new, state:modified and state:old / unmodified.'
ch24-fig2:
  sha1: 94768d8f1805a2b27a8dd72ab7abdb09feda85a7
  alt: 'Where ref(''x'') points with --defer --state. Is x selected in this command? Yes: my schema (dbt_ci.x).
    No: does x exist in my target schema? Yes: my schema (unless --favor-state). No: the state''s relation (prod.x).'
ch24-fig3:
  sha1: 4030bf7f09d0dba36fdbe8cdc4267554f7704bc4
  alt: 'How dbt retry works: dbt build ends with 1 error and 11 skipped and writes target/run_results.json; you
    fix the code; dbt retry reads the file and re-runs the 12 nodes with the same arguments.'
ch25-fig1:
  sha1: 01aa98ad0f7bf64dd7de704d478e0cdf09920fe7
  alt: 'The CI/CD workflow in eight steps, with the environment of each: 1. Branch from main; 2. Change + dbt build
    -s x+ (dev schema); 3. Commit, push, open PR; 4. CI job: slim CI build (CI schema; a red check means fix and
    push again, back to step 2); 5. Review + green check; 6. Merge into main; 7. Deploy: merge or scheduled job;
    8. Production tables + artifacts (production), which are the state for the next CI run.'
ch26-fig1:
  sha1: 7a14b271b3eeb6f667c50710fbad287373624c9c
  alt: 'The ShopFlow capstone DAG at milestone m14 (simplified), in five columns: sources (4 schemas), staging (views),
    intermediate, marts (tables) in two groups, and two dashboard exposures.'
  description: 'Sources and their staging models: shopflow_app (customers, addresses, products, orders, order_items)
    → stg_shopflow_app__customers, __addresses, __products, __orders, __order_items; payments_provider (payments,
    refunds) → stg_payments_provider__payments, __refunds; web_analytics (events) → stg_web_analytics__events; shipping
    (shipments) → stg_shipping__shipments. Snapshots products_snapshot and shipments_snapshot read shopflow_app
    and shipping. Intermediate: the seeds exchange_rates and country_regions and the shopflow_app staging models
    feed int_order_items__priced; the shopflow_app staging models feed int_orders__enriched; the payments_provider
    staging models feed int_payments__per_order (ephemeral), which feeds int_orders__enriched. Group finance marts:
    fct_order_items (from int_order_items__priced), dim_products (from the shopflow_app staging models), fct_orders
    (incremental) and fct_daily_revenue (both from int_orders__enriched). Group marketing marts: dim_customers v1,
    v2 (from int_orders__enriched), customer_rfm (Python, from fct_orders and dim_customers), fct_events (microbatch,
    from stg_web_analytics__events) and fct_sessions (from fct_events). Exposures: weekly_revenue_dashboard (from
    fct_orders and fct_daily_revenue) and customer_segments_dashboard (from customer_rfm and dim_customers).'
ch27-fig1:
  sha1: 7b54679bac9f543ce1319fef1b740c0ee193dc83
  alt: 'The four parts of a scenario question and the order to read them. On the page the parts are Scenario, Evidence,
    Stem, Options. Read them in this order: 1. the Stem (the real question, usually the last sentence, with the
    question mark): read it first, name the objective, circle the keywords; 2. the Scenario (the story: a team,
    a project, a problem to solve), with the question already in mind; 3. the Evidence (code, YAML, a log, a command
    or its output): look for the detail the stem asks about; 4. the Options (one correct answer, sometimes more,
    and several plausible wrong answers): predict first, then eliminate.'
ch27-fig2:
  sha1: ec9a151204f0cc17434ed9aacc37edc6663f65a6
  alt: 'How a DOMC question works: the stem is shown (read it twice) → one option appears → you answer YES or NO
    → if the result is decided, the question ends; if not, the next option appears. There is no way back to an answered
    option.'
ch27-fig3:
  sha1: dfec63860c18665a98e40d17f2b3c8fd16f45ed1
  alt: 'Pacing plan for the 120-minute exam. First pass from minute 0 to 75 (answer, guess, mark), second pass from
    75 to 105, check from 105 to 120. Target checkpoints: Q22 at minute 25, Q44 at minute 50, Q65 at minute 75.
    Safety checkpoints (at the latest): Q22 at minute 40, Q44 at minute 80.'
