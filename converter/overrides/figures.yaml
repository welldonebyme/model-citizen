ch09-fig2:
  sha1: 862c68edf050bd8ff1df9eeadff20acd083c4115
  alt: 'Five common DAG problems; the red arrows are the problems. 1. source() in a mart: fct_orders reads raw.payments
    directly. 2. Staging reads a mart: stg_orders depends on dim_customers. 3. The same logic twice: fct_orders
    and fct_revenue each sum payments per order from stg_payments. 4. Rejoining upstream concepts: A feeds B (whose
    only child is C), and A also feeds C directly. 5. Hard-coded names make a root model: legacy_report reads raw
    tables invisibly, so it has no parents in the DAG and dbt cannot order it.'
ch10-fig1:
  sha1: 6702244bee258d74a1426009b0a4b03ccd653943
  alt: 'Where a config can be set, from the most specific place (it wins) to the least specific: 1. config() in
