ch17-fig2:
  sha1: 4f872628d25fe274ad3f5e05394e478da60b920d
  alt: 'How dbt enforces a model contract, in four steps: 1. Query shape: the model SQL runs with where false limit
    0 and dbt reads its names and types. 2. Contract shape: dbt builds cast(null as <data_type>) for each YAML column
    and reads the types. 3. Compare: names and types, order ignored; any mismatch is an error and nothing is built.
    4. Build: create table with the types and constraints, then insert the rows.'
ch18-fig1:
