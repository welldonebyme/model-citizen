    stripe.payments → stg_stripe__payments. stg_stripe__payments feeds int_payments__successful (ephemeral). int_payments__successful,
    stg_jaffle_shop__orders and stg_jaffle_shop__customers feed int_orders__enriched (a view). int_orders__enriched
