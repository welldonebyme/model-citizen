ch04-fig6:
  sha1: b49696bc32c2246c929893327844406974b0228d
  alt: 'One dbt model (select ...) can become four things in the warehouse: a view (create view ... as select ...),
    a table (create table ... as select ...), an incremental table (first run: create table as select; next runs:
    insert / merge only new rows), or ephemeral (no object at all: the select is pasted as a CTE into the models
    that use it).'
ch05-fig1:
  sha1: 5236eb2d46abdcec22a94f34dcc7890f337e3a5d
  alt: 'The three languages of a dbt project. YAML files (dbt_project.yml, _models.yml, sources.yml) describe and
    configure: they are settings for the models. SQL + Jinja files (stg_orders.sql) transform and become compiled
    SQL. Python files (my_model.py) also transform, but rarely. The compiled SQL and the Python code go to the data
    warehouse (DuckDB on your laptop, Snowflake, BigQuery, Databricks…).'
ch05-fig2:
  sha1: 85e0b5b5c4ed630d575aecdf7477e9a9f72ad072
  alt: 'From a model file to the warehouse in five steps: model file (.sql, SQL + Jinja) → dbt renders Jinja (ref,
    loops…) → compiled SQL in target/compiled/ (a plain select) → dbt wraps it (create view as…, in target/run/)
    → the warehouse executes plain SQL. dbt compile stops after the compiled SQL; dbt run does everything.'
ch06-fig1:
  sha1: 095bef42b0fdbb002792fa5c0f651929af765036
  alt: 'What happens when you run a dbt command, in five steps, with the file each step uses or writes: 1. Load
    project + profile (dbt_project.yml, profiles.yml); 2. Parse: read every file, build the graph (target/manifest.json);
    3. Compile: render Jinja into SQL (target/compiled/); 4. Execute: wrap in DDL, send to the warehouse, a DuckDB
    file (target/run/); 5. Report: write the results (target/run_results.json).'
ch06-fig2:
  sha1: 2cce0a92e4be1ea925d3fb64726e62dfe20c002d
  alt: 'How dbt finds its connection. dbt_project.yml contains name: ''jaffle_dbt'' and profile: ''jaffle_dbt''.
    The same name is the top key of ~/.dbt/profiles.yml (the profile). It has target: dev (the default target) and
    outputs with two targets, dev and prod. dev has type: duckdb, path: ../practice/practice.duckdb, schema: dbt_adnane,
    threads: 4, so dbt builds in practice.duckdb, schema dbt_adnane.'
ch07-fig1:
  sha1: 772f061447367239835751266dc95784391d3a3f
  alt: 'A model file becomes a warehouse object. The file models/marts/fct_orders.sql (with orders as (…), payments
