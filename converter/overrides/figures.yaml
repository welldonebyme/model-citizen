ch08-fig1:
  sha1: 8cf2d83336f350dee71ced152dd6705a00ffd3c3
  alt: 'How dbt replaces a view or a table (the swap), in four steps: 1. Build the new object (create … fct_orders__dbt_tmp);
    2. Move the old one away (rename fct_orders to …__dbt_backup); 3. Give the real name (rename …__dbt_tmp to fct_orders);
    4. Clean up (drop …__dbt_backup). Steps 1–3 are one transaction (BEGIN … COMMIT): if step 1 fails, nothing changes.
