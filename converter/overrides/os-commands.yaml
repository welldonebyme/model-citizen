schema: 1
description: macOS/zsh -> Windows PowerShell rules for the shell commands of the book's bashcode blocks (generated by converter/reference/os_commands.py;
  edit the RULES there, then re-run). dbt commands themselves are identical on every OS. WSL (Ubuntu) users follow the macOS/zsh
  commands (apt or the official installers instead of Homebrew).
tested_with: 'pwsh 7.6.8 (Homebrew, macOS) and zsh in a fixture folder; Windows PowerShell 5.1 and Windows itself: untested
  (see converter/reference/ci/kit-matrix.yml)'
summary:
  rules: 65
  tested_ok: 46
  tested_partly: 8
  untested: 11
  failed: 0
rules:
- id: venv-activate
  category: python env
  zsh: source .venv/bin/activate
  powershell: .venv\Scripts\Activate.ps1
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 15
  tested: 'pwsh 7.6.8 on macOS: output contains ''.venv/bin/python''; partly untested: tested with the venv''s bin/activate.ps1
    under pwsh on macOS; the Windows path .venv\Scripts\Activate.ps1 and the execution-policy prompt are untested'
  notes: 'Relative forms map the same way: `source ../.venv/bin/activate` -> `..\.venv\Scripts\Activate.ps1`. If PowerShell
    says ''running scripts is disabled'', run once: `Set-ExecutionPolicy -Scope CurrentUser RemoteSigned` (or call `.venv\Scripts\dbt.exe`
    directly).'
- id: venv-deactivate
  category: python env
  zsh: deactivate
  powershell: deactivate
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 0
  tested: 'pwsh 7.6.8 on macOS: output contains ''ok'''
- id: uv-venv
  category: python env
  zsh: uv venv --python 3.12 .venv
  powershell: uv venv --python 3.12 .venv
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 2
  tested: 'pwsh 7.6.8 on macOS: output contains ''Create a virtual environment'''
  notes: Identical. uv installs Python 3.12 itself if it is missing.
- id: uv-pip-install
  category: python env
  zsh: uv pip install "dbt-core~=1.11.0" "dbt-duckdb~=1.11.0"
  powershell: uv pip install "dbt-core~=1.11.0" "dbt-duckdb~=1.11.0"
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 4
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
  notes: Identical (double quotes keep `~=` and `==` away from the shell).
- id: python-venv-classic
  category: python env
  zsh: python3.12 -m venv .venv
  powershell: py -3.12 -m venv .venv
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 1
  tested: 'untested: the Windows `py` launcher does not exist on macOS'
  notes: '`py` is the Python launcher installed by the python.org installer.'
- id: python-c
  category: python env
  zsh: python -c "import duckdb; print(duckdb.__version__)"
  powershell: python -c "import duckdb; print(duckdb.__version__)"
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 21
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
  notes: 'Identical when the code uses single quotes inside double quotes (all the book''s examples do). Windows PowerShell
    5.1 drops embedded double quotes passed to programs: never put " inside the code.'
- id: python-script
  category: python env
  zsh: python -I ~/Documents/Adnane/dbt-bible/tools/run_sql.py --db ../practice/practice.duckdb "select ..."
  powershell: python -I $HOME\dbt-course\kit\tools\run_sql.py --db ../practice/practice.duckdb "select ..."
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 15
  tested: 'pwsh 7.6.8 on macOS: output contains ''42 |'''
  notes: Book path -> kit path (see the kit README). Use $HOME, not ~ (next rule).
- id: which
  category: python env
  zsh: which python
  powershell: (Get-Command python).Source
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 3
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
  notes: '`where.exe python` also works (lists every match). Outside a venv, Windows may find the Microsoft Store alias python.exe:
    activate the venv first.'
- id: export
  category: variables
  zsh: export DBT_DEMO_SECRET="abc123"
  powershell: $env:DBT_DEMO_SECRET = "abc123"
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 7
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
  notes: Lasts until the window is closed, like export.
- id: export-pwd
  category: variables
  zsh: export DBT_PROFILES_DIR=$PWD/ci
  powershell: $env:DBT_PROFILES_DIR = "$PWD\ci"
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 3
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
- id: unset
  category: variables
  zsh: unset DBT_DUCKDB_PATH
  powershell: Remove-Item Env:DBT_DUCKDB_PATH
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 2
  tested: 'pwsh 7.6.8 on macOS: output contains ''True'''
- id: env-prefix
  category: variables
  zsh: DBT_TARGET=prod dbt compile
  powershell: $env:DBT_TARGET = "prod"; dbt compile; Remove-Item Env:DBT_TARGET
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 16
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (2 line(s))'
  notes: 'PowerShell has no one-command prefix: set, run, remove. Several variables: set each one.'
- id: echo
  category: variables
  zsh: echo "Hello dbt"
  powershell: echo "Hello dbt"
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 1
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
  notes: echo is an alias of Write-Output in PowerShell.
- id: echo-var
  category: variables
  zsh: echo "My secret is $DBT_DEMO_SECRET"
  powershell: echo "My secret is $env:DBT_DEMO_SECRET"
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 3
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (2 line(s))'
  notes: 'Environment variables are $env:NAME in PowerShell; $HOME exists in both shells. $SHELL has no equivalent: use $PSVersionTable.PSVersion.'
- id: shell-var
  category: variables
  zsh: T=assert_payments_match_order_totals; dbt test -s $T
  powershell: $T = "assert_payments_match_order_totals"; dbt test -s $T
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 13
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
- id: exit-code
  category: exit codes
  zsh: echo $?
  powershell: $LASTEXITCODE
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 16
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
  notes: '`dbt build; echo "exit code: $?"` -> `dbt build; "exit code: $LASTEXITCODE"`. In PowerShell, $? is only True/False;
    $LASTEXITCODE is the number of the last program.'
- id: and-chain
  category: chaining
  zsh: cd ~/dbt-course && source .venv/bin/activate
  powershell: cd $HOME\dbt-course; .venv\Scripts\Activate.ps1
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 24
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (2 line(s)); partly untested: `&&` tested in pwsh 7.6; its absence
    in Windows PowerShell 5.1 is documented, not tested'
  notes: 'PowerShell 7 accepts `&&` (runs the next command only if the previous program succeeded); Windows PowerShell 5.1
    does NOT (parser error). Portable form: separate lines, or `;`.'
- id: comment
  category: chaining
  zsh: 'dbt run   # a comment'
  powershell: 'dbt run   # a comment'
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 56
  tested: 'pwsh 7.6.8 on macOS: output contains ''before'''
  notes: zsh needs `setopt interactivecomments` for typed comments (Chapter 2 trap); PowerShell always accepts them. The `echo
    'setopt interactivecomments' >> ~/.zshrc` step does not exist on Windows.
- id: line-continuation
  category: chaining
  zsh: command \ (backslash at the end of a line)
  powershell: command ` (backtick at the end of a line)
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 0
  tested: 'pwsh 7.6.8 on macOS: output contains ''ab'''
- id: home-tilde
  category: paths
  zsh: git apply ~/dbt-course/kit/bugs/01-jinja-missing-endif.patch
  powershell: git apply $HOME\dbt-course\kit\bugs\01-jinja-missing-endif.patch
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 71
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s)); partly untested: $HOME form tested; the missing ~ expansion
    of Windows PowerShell 5.1 is documented, not tested'
  notes: 'cd/Get-ChildItem accept ~, but programs (git, python, dbt, duckdb) may receive a literal `~`: always write $HOME
    for them. pwsh 7.6 on macOS expands ~ for programs; Windows PowerShell 5.1 does not.'
- id: profiles-path
  category: paths
  zsh: ~/.dbt/profiles.yml
  powershell: $HOME\.dbt\profiles.yml
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 2
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
- id: tmp
  category: paths
  zsh: mv macros/generate_schema_name.sql /tmp/
  powershell: 'Move-Item macros\generate_schema_name.sql $env:TEMP\ '
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 2
  tested: 'untested: $env:TEMP is Windows-only (on macOS pwsh it is empty)'
- id: cd
  category: files
  zsh: cd ~/dbt-course/practice
  powershell: cd $HOME\dbt-course\practice
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 51
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
  notes: '`cd ..` and relative paths are identical (cd = Set-Location).'
- id: pwd
  category: files
  zsh: pwd
  powershell: pwd
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 3
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
  notes: 'pwd = Get-Location (prints a small table: use (Get-Location).Path for the bare path).'
- id: ls
  category: files
  zsh: ls data
  powershell: Get-ChildItem data -Name
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 24
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (5 line(s))'
  notes: On Windows `ls` and `dir` are aliases of Get-ChildItem (a table with Mode/LastWriteTime/Length/Name). `ls -la` ->
    `Get-ChildItem -Force` (shows hidden files). In pwsh on macOS/Linux `ls` runs the system ls.
- id: ls-la
  category: files
  zsh: ls -la
  powershell: Get-ChildItem -Force
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 2
  tested: 'pwsh 7.6.8 on macOS: output contains ''.hidden'''
- id: mkdir-p
  category: files
  zsh: mkdir -p ~/dbt-course/practice
  powershell: New-Item -ItemType Directory -Force $HOME\dbt-course\practice
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 19
  tested: 'pwsh 7.6.8 on macOS: output contains ''True'''
  notes: '`mkdir dir` also works in PowerShell and creates missing parents; -Force = no error if it exists.'
- id: cp
  category: files
  zsh: cp ../practice/practice.duckdb ../practice/practice_copy.duckdb
  powershell: Copy-Item ..\practice\practice.duckdb ..\practice\practice_copy.duckdb
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 12
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (2 line(s))'
- id: cp-R
  category: files
  zsh: cp -R ~/Documents/Adnane/dbt-bible/labs/data ~/dbt-course/practice/
  powershell: 'Copy-Item -Recurse <kit>\data $HOME\dbt-course\practice\ '
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 2
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (5 line(s))'
  notes: Like cp -R, Copy-Item -Recurse into an existing folder creates <folder>\data.
- id: mv
  category: files
  zsh: mv a.sql b.sql
  powershell: Move-Item a.sql b.sql
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 2
  tested: 'pwsh 7.6.8 on macOS: output contains ''True'''
- id: rm
  category: files
  zsh: rm ../practice/practice_copy.duckdb
  powershell: Remove-Item ..\practice\practice_copy.duckdb
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 3
  tested: 'pwsh 7.6.8 on macOS: output contains ''False'''
- id: rm-r
  category: files
  zsh: rm -r models/example
  powershell: Remove-Item -Recurse -Force models\example
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 6
  tested: 'pwsh 7.6.8 on macOS: output contains ''False'''
- id: cat
  category: files
  zsh: cat notes.txt
  powershell: Get-Content notes.txt
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 6
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (13 line(s))'
  notes: On Windows `cat` and `type` are aliases of Get-Content.
- id: cat-n-sed
  category: files
  zsh: cat -n file.sql | sed -n 11,16p
  powershell: Get-Content file.sql | Select-Object -Skip 10 -First 6
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 3
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (6 line(s))'
  notes: 'Without the line numbers. With numbers: `Select-String -Pattern '''' file.sql | Select-Object -Skip 10 -First 6`
    (prints file:line:text).'
- id: head
  category: files
  zsh: head -3 data/orders.csv
  powershell: Get-Content data/orders.csv -TotalCount 3
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 3
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (3 line(s))'
- id: tail
  category: files
  zsh: tail -2 data/customers.csv
  powershell: Get-Content data/customers.csv -Tail 2
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 2
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (2 line(s))'
- id: pipe-head-tail
  category: files
  zsh: grep "Binder Error" logs/dbt.log | tail -3
  powershell: Select-String -CaseSensitive "Binder Error" logs/dbt.log | Select-Object -Last 3
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 11
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (2 line(s))'
  notes: '`| head -N` -> `| Select-Object -First N`; `| tail -N` -> `| Select-Object -Last N`.'
- id: sed-n
  category: files
  zsh: sed -n '1,8p' target/compiled/.../stg_jaffle_shop__orders.sql
  powershell: Get-Content target\compiled\...\stg_jaffle_shop__orders.sql -TotalCount 8
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 3
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (8 line(s))'
  notes: '`sed -n ''A,Bp'' f` -> `Get-Content f | Select-Object -Skip (A-1) -First (B-A+1)`.'
- id: wc-l
  category: files
  zsh: wc -l data/*.csv
  powershell: Get-ChildItem data\*.csv | ForEach-Object { "{0,6} {1}" -f (Get-Content $_.FullName).Count, $_.Name }
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 4
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
  notes: '`cmd | wc -l` -> `(cmd | Measure-Object).Count`. Counts are the same; the layout differs.'
- id: grep
  category: search
  zsh: grep "coffee" data/products.csv
  powershell: (Select-String -CaseSensitive "coffee" data/products.csv).Line
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 21
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (4 line(s))'
  notes: 'Select-String is case-INSENSITIVE by default (grep is case-sensitive): add -CaseSensitive. It prints file:line:text;
    `.Line` gives the bare lines. Patterns are regular expressions (like grep -E). Options: -c -> `(Select-String ...).Count`;
    -i -> no option (default); -n -> default output; -v -> -NotMatch; -o -> `| ForEach-Object { $_.Matches.Value }`; -m1 ->
    `| Select-Object -First 1`; -B4 -A8 -> `-Context 4,8`.'
- id: grep-c
  category: search
  zsh: grep -c "placed" data/orders.csv
  powershell: (Select-String -CaseSensitive "placed" data/orders.csv).Count
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 2
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
- id: grep-E-pipe
  category: search
  zsh: dbt debug | grep -E 'path:|Connection test|All checks'
  powershell: dbt debug | Select-String -CaseSensitive 'path:|Connection test|All checks'
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 2
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (5 line(s))'
- id: grep-n-tail
  category: search
  zsh: grep -n "Binder Error" logs/dbt.log | tail -3
  powershell: Select-String -CaseSensitive "Binder Error" logs/dbt.log | Select-Object -Last 3 | ForEach-Object { "$($_.LineNumber):$($_.Line)"
    }
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 7
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (3 line(s))'
- id: find
  category: search
  zsh: find target/compiled -path '*unit_tests*' -name '*.sql'
  powershell: Get-ChildItem target\compiled -Recurse -Filter *.sql | Where-Object FullName -like '*unit_tests*' | ForEach-Object
    FullName
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 2
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (2 line(s))'
  notes: '`find jaffle_dbt | sort` -> `Get-ChildItem -Recurse -Name jaffle_dbt | Sort-Object` (Windows prints \ in paths).'
- id: sort
  category: search
  zsh: sort
  powershell: Sort-Object
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 1
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (3 line(s))'
- id: diff
  category: search
  zsh: diff models/marts/dim_customers.sql models/marts/dim_customers_v2.sql
  powershell: git diff --no-index models/marts/dim_customers.sql models/marts/dim_customers_v2.sql
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 3
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
  notes: git diff --no-index works on any two files on every OS (unified format). PowerShell's own Compare-Object (Get-Content
    a) (Get-Content b) shows <= and => lines.
- id: jq
  category: search
  zsh: dbt --quiet ls -s fct_orders --output json --output-keys config | jq -c '.config.grants'
  powershell: dbt --quiet ls -s fct_orders --output json --output-keys config | ConvertFrom-Json | ForEach-Object { $_.config.grants
    | ConvertTo-Json -Compress }
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 9
  tested: 'pwsh 7.6.8 on macOS: output contains ''{"select":["reporter"]}''; partly untested: ConvertFrom-Json form tested;
    jq on Windows untested (jq is not installed here)'
  notes: jq also exists for Windows (`winget install jqlang.jq`) and then the book's command works as it is.
- id: echo-redirect
  category: files
  zsh: echo "first line" > notes.txt; echo "second line" >> notes.txt
  powershell: Set-Content notes.txt "first line"; Add-Content notes.txt "second line"
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 9
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (2 line(s)); partly untested: tested in pwsh 7.6 (UTF-8); the UTF-16
    behaviour of > and >> in Windows PowerShell 5.1 is documented, not tested'
  notes: 'PowerShell also has > and >>, but in Windows PowerShell 5.1 they write UTF-16 text. Appending with >> to a UTF-8
    file that dbt reads (for example `echo ''-- comment'' >> models/...sql` in Chapter 16) mixes two encodings and breaks
    the file: use Add-Content / Set-Content. `dbt --version > notes.txt` is harmless.'
