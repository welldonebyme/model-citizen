  book_lines: 1
  tested: 'untested: winget is Windows-only'
  notes: 'Without winget: `powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"`. Open a new
    PowerShell window afterwards.'
- id: brew-duckdb
  category: install
  zsh: brew install duckdb
  powershell: winget install DuckDB.cli
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 1
  tested: 'untested: winget is Windows-only'
  notes: 'Then align the venv: `uv pip install "duckdb==X.Y.Z"` with the CLI''s number.'
- id: brew-version
  category: install
  zsh: brew --version
  powershell: winget --version
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 1
  tested: 'untested: winget is Windows-only'
- id: brew-vscode
  category: install
  zsh: brew install --cask visual-studio-code
  powershell: winget install Microsoft.VisualStudioCode
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 0
  tested: 'untested: winget is Windows-only'
- id: git-install
  category: install
  zsh: xcode-select --install (Git comes with the command line tools)
  powershell: winget install --id Git.Git -e
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 0
  tested: 'untested: winget is Windows-only'
  notes: 'Then once: `git config --global core.autocrlf true` (Windows line endings in files, LF in the repository).'
- id: gh
  category: install
  zsh: gh auth login
  powershell: gh auth login
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 3
  tested: 'untested: gh is not installed on the test machine'
  notes: Install with `winget install GitHub.cli`; the commands are identical.
- id: git
  category: git
  zsh: git status / git log --oneline --graph --all / git commit -m "..." / git switch -c ...
  powershell: identical
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 244
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
  notes: 'Every git command of the book is the same in PowerShell. Differences: use $HOME instead of ~ in paths (rule home-tilde);
    keep the double quotes around refspecs with * (`git fetch --no-tags reference "refs/tags/*:refs/tags/ref-*"`); git may
    print LF/CRLF warnings on Windows (harmless with core.autocrlf true).'
- id: git-apply
  category: git
  zsh: git apply ~/dbt-course/kit/bugs/01-jinja-missing-endif.patch
  powershell: git apply $HOME\dbt-course\kit\bugs\01-jinja-missing-endif.patch
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 5
  tested: 'pwsh 7.6.8 on macOS: output contains ''exit 0'''
  notes: 'If it fails with ''patch does not apply'' on a correct file, the file has CRLF line endings and core.autocrlf is
    false: add --ignore-whitespace (also for -R). Tested with git 2.50 on CRLF copies of the files: plain apply works with
    core.autocrlf=true, --ignore-whitespace works with core.autocrlf=false.'
- id: glob-quotes
  category: dbt
  zsh: dbt ls -s "stg_jaffle_shop__*"
  powershell: dbt ls -s "stg_jaffle_shop__*"
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 77
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s))'
  notes: 'zsh fails on an unquoted * (`no matches found`); PowerShell passes it to dbt unchanged, but keep the quotes: the
    same command then works everywhere.'
- id: json-arg
  category: dbt
  zsh: 'dbt ls -s x --warn-error-options ''{"error": ["NoNodesForSelectionCriteria"]}'''
  powershell: 'dbt ls -s x --warn-error-options ''{\"error\": [\"NoNodesForSelectionCriteria\"]}''  (Windows PowerShell 5.1)  /  same
    as zsh (PowerShell 7.3+)'
  wsl: same as macOS/zsh (bash in Ubuntu)
  book_lines: 6
  tested: 'pwsh 7.6.8 on macOS: output equals zsh output (1 line(s)); partly untested: pwsh 7.6 passes the JSON unchanged
    (tested); the Windows PowerShell 5.1 quote stripping is documented, not tested'
  notes: 'Windows PowerShell 5.1 removes the double quotes inside a single-quoted argument passed to a program, so dbt receives
    invalid JSON: escape them as \" there. PowerShell 7.3+ passes them correctly. Alternative on every shell: the YAML form
    `--warn-error-options "{error: [NoNodesForSelectionCriteria]}"` (checked with dbt 1.11.16 on macOS: same Compilation Error
    as the JSON form).'
