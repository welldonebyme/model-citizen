    the < form fails in pwsh exactly as described, and the duck.py alternative works (see duck-py); the `duckdb -c ".read
    ..."` form itself is untested here (no DuckDB CLI on the test machine; the CI workflow kit-matrix.yml tests it on windows-latest)'
  notes: 'PowerShell has no < redirection (`The ''<'' operator is reserved for future use.`). The -c ".read" form also works
    on macOS. Without the DuckDB CLI: `python <kit>\tools\duck.py practice.duckdb -f setup.sql`. `duckdb -readonly db < file.sql`
    -> `duckdb -readonly db -c ".read file.sql"`.'
