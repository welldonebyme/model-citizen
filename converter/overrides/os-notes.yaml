    text: "If the activation prints `running scripts is disabled on this system`, run once
      `Set-ExecutionPolicy -Scope CurrentUser RemoteSigned` ([Section 2.8](/learn/ch02/ch02-s8/#ch02-s8-2)), answer
      `Y`, then activate again."

  # ================================================================== outputs recorded on macOS, later chapters
  - id: win-ch16-out-stars
    os: [win]
    step: ch16-s3-3
    code: ch16-c10
    hash: e614f3363d6d
    title: On Windows
    text: "This error comes from zsh on macOS. PowerShell on Windows passes the `*` to dbt unchanged, and dbt then
      lists the matching models. Quote the selection anyway: then the command works the same in every shell."
  - id: win-ch20-out-ls
    os: [win]
    step: ch20-s4-1
    code: ch20-c21
    hash: 4024c958132a
    title: On Windows
    text: "The output above was recorded on macOS with `ls -la`. On Windows `Get-ChildItem` prints a `Directory:`
      line and a table with Mode, LastWriteTime, Length (the size in bytes) and Name, with no owner or group."
  - id: win-ch20-out-static
    os: [win]
    step: ch20-s5-2
    code: ch20-c36
    hash: e8b67adf652e
    title: On Windows
    text: "The output above was recorded on macOS. On Windows the catalog path is
      `C:\\Users\\<you>\\dbt-course\\jaffle_dbt\\target\\catalog.json`, and `Get-ChildItem` prints a table (Mode,
      LastWriteTime, Length, Name) instead of the `ls -la` line."

  # ================================================================== Chapter 2 quiz: macOS shell questions (F17)
  - id: win-q-ch02-05
    os: [win]
    question: q-ch02-05
    starts: "B. A new terminal does not have the venv active."
    hash: 211a97c45cda
    title: On Windows
    text: "In PowerShell the message reads `dbt : The term 'dbt' is not recognized ...`, and the fix is the same:
      activate the venv, there with `.venv\\Scripts\\Activate.ps1`."
  - id: win-q-ch02-08
    os: [win]
    question: q-ch02-08
    starts: "c, d, b, a, e."
    hash: 0f738336124a
    title: On Windows
    text: "On Windows the same order uses `New-Item -ItemType Directory -Force $HOME\\dbt-course` and
      `cd $HOME\\dbt-course` (step C) and `.venv\\Scripts\\Activate.ps1` (step B)."
  - id: win-q-ch02-14
    os: [win]
    question: q-ch02-14
    starts: "-a (for example ls -la)."
    hash: 1741571ffb1c
    title: On Windows
    text: "This question is about `ls` (macOS, Linux and WSL). In PowerShell the option that shows hidden items is
      `-Force`: `Get-ChildItem -Force`."
