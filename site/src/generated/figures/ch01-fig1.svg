<title id="ch01-fig1-title">Row storage compared with column storage. Left, row storage (OLTP): each of three order rows (id, order_date, status) is stored together as one block (block 1, 2, 3). Right, column storage (OLAP): all ids are stored together, all order dates together, all statuses together; each column is stored (and compressed) together.</title>
