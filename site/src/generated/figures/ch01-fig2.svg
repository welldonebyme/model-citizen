<title id="ch01-fig2-title">A data pipeline in five steps: Sources (shop app database, Stripe, CRM, files) → Extract &amp; Load (Fivetran, Airbyte, scripts) → Warehouse (raw tables, an untouched copy) → Transform (dbt, SQL models; highlighted) → Use (BI dashboards, ML, reverse ETL). A brace under the first steps says “E + L: copy data as it is”; a brace under Transform says “T: inside the warehouse”.</title>
