<title id="ch03-fig4-title">The pull request workflow in eight steps: 1. Create branch, 2. Edit, test, commit, 3. Push branch, 4. Open pull request, 5. CI checks + review, 6. Fix if needed (new commits go back to step 5), 7. Merge into main (when approved and green), 8. Pull main, delete branch.</title>
