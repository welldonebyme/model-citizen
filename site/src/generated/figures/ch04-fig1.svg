<title id="ch04-fig1-title">The order in which a SQL query is written compared with the order in which it is evaluated. Written: SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT. Evaluated: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT. SELECT is highlighted: aliases are created there, so they can be used in ORDER BY but not in WHERE (standard SQL).</title>
