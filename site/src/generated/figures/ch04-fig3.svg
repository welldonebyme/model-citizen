<title id="ch04-fig3-title">Why a join can multiply amounts (fan-out). Order 1 has 2 payments in stripe.payments: 500 and 2520, sum 3020 (30.20). After a join with its 3 item lines (products 8, 10 and 12), each payment appears 3 times: 6 rows, and the sum becomes 9060 (90.60), three times too much.</title>
