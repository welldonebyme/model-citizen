<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332.82 179.51" width="444" height="239" role="img" data-figure="ch04-fig6" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch04-fig6-title">
<title id="ch04-fig6-title">One dbt model (select ...) can become four things in the warehouse: a view (create view ... as select ...), a table (create table ... as select ...), an incremental table (first run: create table as select; next runs: insert / merge only new rows), or ephemeral (no object at all: the select is pasted as a CTE into the models that use it).</title>
