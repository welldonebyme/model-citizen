<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 401.39 125.13" width="535" height="167" role="img" data-figure="ch05-fig1" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch05-fig1-title">
<title id="ch05-fig1-title">The three languages of a dbt project. YAML files (dbt_project.yml, _models.yml, sources.yml) describe and configure: they are settings for the models. SQL + Jinja files (stg_orders.sql) transform and become compiled SQL. Python files (my_model.py) also transform, but rarely. The compiled SQL and the Python code go to the data warehouse (DuckDB on your laptop, Snowflake, BigQuery, Databricks…).</title>
