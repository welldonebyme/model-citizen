<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 414.79 92.63" width="553" height="124" role="img" data-figure="ch05-fig2" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch05-fig2-title">
<title id="ch05-fig2-title">From a model file to the warehouse in five steps: model file (.sql, SQL + Jinja) → dbt renders Jinja (ref, loops…) → compiled SQL in target/compiled/ (a plain select) → dbt wraps it (create view as…, in target/run/) → the warehouse executes plain SQL. dbt compile stops after the compiled SQL; dbt run does everything.</title>
