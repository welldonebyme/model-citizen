<title id="ch06-fig1-title">What happens when you run a dbt command, in five steps, with the file each step uses or writes: 1. Load project + profile (dbt_project.yml, profiles.yml); 2. Parse: read every file, build the graph (target/manifest.json); 3. Compile: render Jinja into SQL (target/compiled/); 4. Execute: wrap in DDL, send to the warehouse, a DuckDB file (target/run/); 5. Report: write the results (target/run_results.json).</title>
