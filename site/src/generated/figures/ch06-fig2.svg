<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 453.65 124.1" width="605" height="165" role="img" data-figure="ch06-fig2" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch06-fig2-title">
<title id="ch06-fig2-title">How dbt finds its connection. dbt_project.yml contains name: 'jaffle_dbt' and profile: 'jaffle_dbt'. The same name is the top key of ~/.dbt/profiles.yml (the profile). It has target: dev (the default target) and outputs with two targets, dev and prod. dev has type: duckdb, path: ../practice/practice.duckdb, schema: dbt_adnane, threads: 4, so dbt builds in practice.duckdb, schema dbt_adnane.</title>
