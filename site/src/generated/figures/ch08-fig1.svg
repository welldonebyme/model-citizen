<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 431.08 74.89" width="575" height="100" role="img" data-figure="ch08-fig1" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch08-fig1-title">
<title id="ch08-fig1-title">How dbt replaces a view or a table (the swap), in four steps: 1. Build the new object (create … fct_orders__dbt_tmp); 2. Move the old one away (rename fct_orders to …__dbt_backup); 3. Give the real name (rename …__dbt_tmp to fct_orders); 4. Clean up (drop …__dbt_backup). Steps 1–3 are one transaction (BEGIN … COMMIT): if step 1 fails, nothing changes. Step 4 runs after the COMMIT.</title>
