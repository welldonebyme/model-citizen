<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 391.51 114.14" width="522" height="152" role="img" data-figure="ch09-fig2" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch09-fig2-title">
<title id="ch09-fig2-title">Five common DAG problems; the red arrows are the problems. 1. source() in a mart: fct_orders reads raw.payments directly. 2. Staging reads a mart: stg_orders depends on dim_customers. 3. The same logic twice: fct_orders and fct_revenue each sum payments per order from stg_payments. 4. Rejoining upstream concepts: A feeds B (whose only child is C), and A also feeds C directly. 5. Hard-coded names make a root model: legacy_report reads raw tables invisibly, so it has no parents in the DAG and dbt cannot order it.</title>
