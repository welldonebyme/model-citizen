<title id="ch10-fig1-title">Where a config can be set, from the most specific place (it wins) to the least specific: 1. config() in the model file (.sql), or dbt.config() in a Python model; 2. config: in a properties YAML file (models/.../*.yml); 3. dbt_project.yml: file key &gt; sub-folder &gt; folder &gt; project level, and root project &gt; installed package; 4. the dbt default (view, on_schema_change: ignore, severity: error…).</title>
