<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 408.52 70.95" width="545" height="95" role="img" data-figure="ch10-fig2" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch10-fig2-title">
<title id="ch10-fig2-title">The order of hooks in dbt run: on-run-start (once); then, repeated for every selected model: BEGIN, pre-hooks (project, model), create table or view, post-hooks (project, model), COMMIT, after_commit hooks; finally on-run-end (once). From BEGIN to COMMIT is one transaction per model (on adapters with transactions).</title>
