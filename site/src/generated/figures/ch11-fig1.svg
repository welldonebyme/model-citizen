<title id="ch11-fig1-title">dbt renders Jinja twice. Project files (.sql and .yml) → 1. parse: renders all Jinja with execute = False (no query is sent: run_query returns nothing) → manifest and DAG (who refs whom) → 2. execute: renders again with execute = True, only for the selected nodes → the warehouse runs the SQL.</title>
