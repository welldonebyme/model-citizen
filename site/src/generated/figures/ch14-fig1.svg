<title id="ch14-fig1-title">The two paths of an incremental model. First run (or --full-refresh): raw orders (300 rows) → model SQL with the filter skipped → create table fct_orders, 300 rows. Later runs (the table exists): raw orders (320 rows) → model SQL + filter, is_incremental(): 33 rows → temporary table fct_orders__dbt_tmp... → schema check (on_schema_change) → strategy SQL (here MERGE) into fct_orders: 320 rows.</title>
