<title id="ch14-fig2-title">The monthly batches of a microbatch model, from 25-01 (begin: 2025-01-01) to 26-10. A normal run on 2026-10-21 rebuilds only the current batch + lookback=1: 26-09 and 26-10. Late orders of January 2026 (loaded on day 2) are missed; a backfill with --event-time-start 2026-01-01 --event-time-end 2026-02-01 rebuilds the 26-01 batch.</title>
