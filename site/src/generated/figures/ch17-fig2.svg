<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370.24 68.16" width="494" height="91" role="img" data-figure="ch17-fig2" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch17-fig2-title">
<title id="ch17-fig2-title">How dbt enforces a model contract, in four steps: 1. Query shape: the model SQL runs with where false limit 0 and dbt reads its names and types. 2. Contract shape: dbt builds cast(null as &lt;data_type&gt;) for each YAML column and reads the types. 3. Compare: names and types, order ignored; any mismatch is an error and nothing is built. 4. Build: create table with the types and constraints, then insert the rows.</title>
