<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452.79 172.23" width="604" height="230" role="img" data-figure="ch18-fig1" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch18-fig1-title">
<title id="ch18-fig1-title">The kinds of dbt tests. dbt tests are data tests (real data) or unit tests (logic, fake rows). Data tests are generic tests (attached in YAML) or singular tests (tests/*.sql). Generic tests are built-in (unique, not_null, accepted_values, relationships), from packages (dbt_utils.*, dbt_expectations.*) or custom generic ({% test %} block in tests/generic/). Unit tests are written under unit_tests: in YAML (Chapter 19).</title>
