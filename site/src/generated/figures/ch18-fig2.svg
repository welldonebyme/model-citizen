<title id="ch18-fig2-title">In dbt build, a failing test blocks the nodes after it. stg_jaffle_shop__customers and stg_jaffle_shop__orders are OK. The relationships test on them fails (FAIL 1). int_orders__enriched waits for the test, so it is skipped (SKIP), and so is fct_orders … after it. fct_order_items does not depend on the test and is built (OK).</title>
