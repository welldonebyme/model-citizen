<title id="ch18-fig3-title">Tests in the development workflow. Development: dbt build -s my_model+ after each change, before each commit. Then a pull request goes to CI: dbt build -s state:modified+ on every pull request; a failure blocks the merge. After the merge, the production job: dbt source freshness and dbt build, scheduled, with alerts on failure.</title>
