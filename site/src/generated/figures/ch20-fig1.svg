<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392.92 144.19" width="524" height="192" role="img" data-figure="ch20-fig1" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch20-fig1-title">
<title id="ch20-fig1-title">How the dbt documentation site is made. Your project (.sql .yml .md: descriptions, doc blocks) → parse + compile → manifest.json. The warehouse (information schema: columns, types, stats) → metadata queries → catalog.json. dbt itself (the website code) → copied → index.html. The three files are in target/ after dbt docs generate; dbt docs serve starts a local web server → your browser.</title>
