<title id="ch20-fig2-title">A sketch of the lineage graph in the dbt docs website. stripe.payments → stg_stripe__payments and jaffle_shop.orders → stg_jaffle_shop__orders; both feed int_orders__enriched, which feeds fct_monthly_revenue and fct_orders; fct_monthly_revenue feeds monthly_revenue_dashboard. The bar at the bottom has resources, packages, tags, a --select box with +fct_monthly_revenue+, an --exclude box and an Update Graph button.</title>
