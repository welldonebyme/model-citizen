<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441.13 64.92" width="588" height="87" role="img" data-figure="ch21-fig1" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch21-fig1-title">
<title id="ch21-fig1-title">The chain around a dbt project: Web shop, Stripe (source systems) → Loader (Fivetran, Airbyte, a script) → Raw tables = dbt sources → dbt models (staging, marts) → Dashboards, notebooks = dbt exposures. The first two steps are outside dbt. Source freshness asks “did new data arrive?”; exposures answer “who uses my models?”.</title>
