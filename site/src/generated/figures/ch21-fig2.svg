<title id="ch21-fig2-title">Source freshness on an age axis, where age = now − max(_loaded_at). From age 0 (just loaded) to warn_after (12 hours) the result is PASS; from 12 hours to error_after (24 hours) it is WARN; after 24 hours it is ERROR STALE.</title>
