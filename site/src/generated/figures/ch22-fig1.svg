<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436.35 137.08" width="582" height="183" role="img" data-figure="ch22-fig1" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch22-fig1-title">
<title id="ch22-fig1-title">The four phases of a dbt command, the cheapest command that reaches each phase, and its typical errors. 1. Parse (read YAML and files; dbt parse): Parsing Error (YAML), Compilation Error (Jinja syntax, missing ref/source, duplicate names). 2. Compile (render Jinja, link the DAG; dbt compile, dbt ls): Compilation Error (unknown macro, missing var), Found a cycle (a “Dependency Error”). 3. Execute (send SQL to the warehouse; dbt run, dbt show): Runtime Error / Binder Error (DuckDB), Database Error (other warehouses), connection errors. 4. Check (data tests and unit tests; dbt test, dbt build): FAIL / WARN (the data breaks a rule).</title>
