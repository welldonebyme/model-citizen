<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332.56 238.86" width="443" height="318" role="img" data-figure="ch22-fig2" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch22-fig2-title">
<title id="ch22-fig2-title">A decision tree to find the cause of an error. Did dbt stop before sending SQL (Parsing / Compilation Error, cycle)? Yes: a dbt problem in the files: fix YAML, Jinja, ref/source names; check with dbt parse and dbt ls. No: copy target/compiled/… into the warehouse console and run it. Does it fail too? Yes: a pure SQL problem: fix the SQL in the model (column, join, syntax); use dbt show to check. No, it works: a dbt problem around the SQL: read target/run and logs/dbt.log (materialization, ;, contract, hooks, permissions on the target schema, incremental filter, on_schema_change…).</title>
