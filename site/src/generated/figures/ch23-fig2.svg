<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412.78 107.16" width="550" height="143" role="img" data-figure="ch23-fig2" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch23-fig2-title">
<title id="ch23-fig2-title">Two kinds of clone. On Snowflake, Databricks and BigQuery, a zero-copy clone: marts.fct_orders and dbt_adnane.fct_orders point to the same shared storage blocks (no copy); the clone is a real table. On DuckDB, Postgres and others, a pointer view: dbt_adnane.fct_orders is a view (select * from marts.fct_orders, the table), so every query reads production.</title>
