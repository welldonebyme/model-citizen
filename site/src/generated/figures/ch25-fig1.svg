<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 381.79 146.62" width="509" height="195" role="img" data-figure="ch25-fig1" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch25-fig1-title">
<title id="ch25-fig1-title">The CI/CD workflow in eight steps, with the environment of each: 1. Branch from main; 2. Change + dbt build -s x+ (dev schema); 3. Commit, push, open PR; 4. CI job: slim CI build (CI schema; a red check means fix and push again, back to step 2); 5. Review + green check; 6. Merge into main; 7. Deploy: merge or scheduled job; 8. Production tables + artifacts (production), which are the state for the next CI run.</title>
