<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385.2 157.01" width="514" height="209" role="img" data-figure="ch27-fig1" font-family="var(--fig-font-sans, 'Fira Sans', 'Helvetica Neue', Arial, sans-serif)" fill="var(--fig-text, #000000)" stroke-miterlimit="10" aria-labelledby="ch27-fig1-title">
<title id="ch27-fig1-title">The four parts of a scenario question and the order to read them. On the page the parts are Scenario, Evidence, Stem, Options. Read them in this order: 1. the Stem (the real question, usually the last sentence, with the question mark): read it first, name the objective, circle the keywords; 2. the Scenario (the story: a team, a project, a problem to solve), with the question already in mind; 3. the Evidence (code, YAML, a log, a command or its output): look for the detail the stem asks about; 4. the Options (one correct answer, sometimes more, and several plausible wrong answers): predict first, then eliminate.</title>
