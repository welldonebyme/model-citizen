version: 2

sources:
  - name: jaffle_shop
    description: Raw data copied every night from the Jaffle Shop web application.
    schema: jaffle_shop   # same as the source name, so this line is optional
    config:
      # freshness for every table of this source...
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: customers
        description: One row per customer account.
        config:
          freshness: null          # ...except the tables without a _loaded_at column
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: orders
        description: One row per order. user_id points to customers.id.
        config:
          event_time: order_date   # used by microbatch and --sample
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: order_items
        description: One row per product line inside an order.
        config:
          freshness: null
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: products
        description: The product catalogue. Prices are in cents.
        config:
          freshness: null
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
