# Profile used ONLY by the CI workflow (DBT_PROFILES_DIR points to this folder).
# Your own profile stays in ~/.dbt/profiles.yml.
jaffle_dbt:
  target: ci
  outputs:
    ci:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH') }}"
      schema: dbt_ci
      threads: 4
    prod:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH') }}"
      schema: prod
      threads: 4
