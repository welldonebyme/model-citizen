<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dbt in Pyodide spike</title>
<style>
  body { font: 13px/1.4 ui-monospace, Menlo, monospace; margin: 16px; background: #fff; color: #111; }
  pre { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<p>Spike: real dbt-core 1.11.16 + dbt-duckdb 1.11.0 in Pyodide (Web Worker). Query string: ?scenario=ch07.txt&amp;tag=ch07&amp;pandas=1</p>
<pre id="out"></pre>
<script type="module">
  const qs = new URLSearchParams(location.search);
  const scenario = qs.get("scenario") || "ch07.txt", tag = qs.get("tag") || "ch07", extra = qs.get("pandas") === "1";
  const pre = document.getElementById("out");
  const w = new Worker("./worker.mjs", { type: "module" });
  window.spike = { lines: [], done: false };
  w.onmessage = (ev) => {
    const m = ev.data;
    if (m.type === "out") { window.spike.lines.push(m.text); pre.textContent += m.text + "\n"; console.log(m.text); }
    else { Object.assign(window.spike, m, { done: true }); console.log("SPIKE_" + m.type.toUpperCase(), JSON.stringify(m)); }
  };
  w.postMessage({ scenario, tag, extra });
</script>
</body>
</html>
